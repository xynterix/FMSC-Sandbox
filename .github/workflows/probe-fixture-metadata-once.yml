name: 00 - Focused SQL fixture schema diagnosis

on:
  push:
    paths:
      - '.github/workflows/probe-fixture-metadata-once.yml'

permissions:
  contents: read

jobs:
  fixture:
    runs-on: windows-2022
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        schema: [3, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: farhan2166-creator/FMSC-Source
          ref: a71dddb3f0fc29bec1c15aa61deccd7e5c77542b
          path: fmsc-source
          persist-credentials: false
      - name: Inspect SQL property types and v7 structural contract on disposable copy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Data
          $schema=[int]'${{ matrix.schema }}'
          $db="FMSC_DIAG_$schema"
          # LocalDB starts under the runner user; keep attached copies in its local profile.
          $root=Join-Path $env:LOCALAPPDATA "FMSC_DIAG_$schema"
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($fn in @('FMSC_DB.mdf','FMSC_DB_log.ldf')) {
            $src=Join-Path $env:GITHUB_WORKSPACE "Database/v$schema/$fn"
            $dest=Join-Path $root $fn
            Copy-Item -LiteralPath $src -Destination $dest
            $copy=Get-Item -LiteralPath $dest
            $copy.IsReadOnly=$false
            if ($copy.IsReadOnly) { throw "SQL copy remains read-only: $fn" }
            $stream=[IO.File]::Open($dest,[IO.FileMode]::Open,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
            $stream.Dispose()
            Write-Host "SQL $fn copy is writable, size=$($copy.Length)"
          }
          $localdb=Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if (-not $localdb) { $ldExe=Join-Path $env:ProgramFiles 'Microsoft SQL Server/160/Tools/Binn/SqlLocalDB.exe' }
          else { $ldExe=$localdb.Source }
          if (-not (Test-Path -LiteralPath $ldExe)) { throw 'LocalDB not installed' }
          & $ldExe start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB start failed' }

          function Query([string]$database,[string]$query,[string]$json='') {
            $conn=[System.Data.SqlClient.SqlConnection]::new("Data Source=(localdb)\MSSQLLocalDB;Initial Catalog=$database;Integrated Security=True;Encrypt=False")
            try {
              $conn.Open()
              $cmd=$conn.CreateCommand()
              $cmd.CommandText=$query
              $cmd.CommandTimeout=120
              if ($json) { [void]$cmd.Parameters.Add('@Requirements',[System.Data.SqlDbType]::NVarChar,-1); $cmd.Parameters['@Requirements'].Value=$json }
              $ds=[System.Data.DataSet]::new()
              $ad=[System.Data.SqlClient.SqlDataAdapter]::new($cmd)
              [void]$ad.Fill($ds)
              return $ds
            } finally { $conn.Dispose() }
          }
          $mp=(Join-Path $root 'FMSC_DB.mdf').Replace("'","''")
          $lp=(Join-Path $root 'FMSC_DB_log.ldf').Replace("'","''")
          [void](Query master "CREATE DATABASE [$db] ON (FILENAME=N'$mp'),(FILENAME=N'$lp') FOR ATTACH;")
          try {
            $state=Query master "SELECT is_read_only FROM sys.databases WHERE name=N'$db';"
            $ro=[int]$state.Tables[0].Rows[0][0]
            Write-Host "SCHEMA $schema SOURCE DATABASE READ_ONLY=$ro"
            if ($ro -eq 1) {
              [void](Query master "ALTER DATABASE [$db] SET READ_WRITE WITH ROLLBACK IMMEDIATE;")
              Write-Host "SCHEMA $schema DISPOSABLE COPY CHANGED TO READ_WRITE"
            }
            $sql=@'
          SET NOCOUNT ON;
          SELECT name,CONVERT(nvarchar(30),SQL_VARIANT_PROPERTY(value,'BaseType')) AS BaseType
          FROM sys.extended_properties
          WHERE class=0 AND name IN (N'FMSC_QuickRegistrationScope',N'FMSC_DisposableFixture');
          '@
            $types=Query $db $sql
            Write-Host "SCHEMA $schema BEFORE: $((@($types.Tables[0].Rows | ForEach-Object { $_['name'].ToString()+':'+$_['BaseType'].ToString() })) -join ', ')"
            $fix=@'
          DECLARE @scope uniqueidentifier=NEWID();
          IF EXISTS(SELECT 1 FROM sys.extended_properties WHERE class=0 AND name=N'FMSC_QuickRegistrationScope')
              EXEC sys.sp_updateextendedproperty @name=N'FMSC_QuickRegistrationScope',@value=@scope;
          ELSE
              EXEC sys.sp_addextendedproperty @name=N'FMSC_QuickRegistrationScope',@value=@scope;
          SELECT name,CONVERT(nvarchar(30),SQL_VARIANT_PROPERTY(value,'BaseType')) AS BaseType,
                 CASE WHEN TRY_CONVERT(uniqueidentifier,value) IS NULL THEN 0 ELSE 1 END AS ValidGuid
          FROM sys.extended_properties
          WHERE class=0 AND name=N'FMSC_QuickRegistrationScope';
          '@
            $after=Query $db $fix
            Write-Host "SCHEMA $schema AFTER: $((@($after.Tables[0].Rows | ForEach-Object { $_['name'].ToString()+':'+$_['BaseType'].ToString()+';guid='+$_['ValidGuid'].ToString() })) -join ', ')"
            [void](Query $db @'
-- Schema-only DACPAC snapshots exclude module bootstrap rows.
-- Restore ONLY fixed, non-personal, disabled defaults on this throwaway copy.
IF SCHEMA_ID(N'comm') IS NOT NULL
BEGIN
 IF OBJECT_ID(N'comm.Module',N'U') IS NULL OR OBJECT_ID(N'comm.Settings',N'U') IS NULL
     THROW 51013,'Disposable communication schema missing required bootstrap tables',1;
 IF NOT EXISTS(SELECT 1 FROM comm.Module) INSERT comm.Module(Version) VALUES(1);
 IF NOT EXISTS(SELECT 1 FROM comm.Settings)
     INSERT comm.Settings(Id,Mode,Paused,MaxBatch,ApprovalThreshold,HourLimit,DayLimit,
         DailyBudget,MonthlyBudget,SmsUnitCost,WhatsAppUnitCost,Currency,QuietStart,QuietEnd,
         UtcOffsetMinutes,RegistrationConfirmed,NextSendUtc,UpdatedBy,UpdatedUtc)
     VALUES(1,'Disabled',1,100,25,60,200,10,100,NULL,NULL,'USD',20,8,300,0,
         SYSUTCDATETIME(),NULL,SYSUTCDATETIME());
END;
'@)
            if ($schema -eq 3) {
              foreach ($version in 4..7) {
                $script=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "fmsc-source/Migrations/$version.sql") -Raw
                [void](Query $db $script)
                $ver=Query $db 'SELECT TOP(1) TRY_CONVERT(int,VersionNumber) FROM dbo.DatabaseVersion ORDER BY VersionId DESC;'
                if ([int]$ver.Tables[0].Rows[0][0] -ne $version) {
                  throw "Schema 3 migrated to unexpected version, expected $version"
                }
                Write-Host "SCHEMA 3 MIGRATION $version PASS"
              }
            }
            if ($schema -in @(3,7)) {
              $path=Join-Path $env:GITHUB_WORKSPACE 'fmsc-source/Core/DatabaseCompatibility.cs'
              $code=Get-Content -LiteralPath $path -Raw
              $m=[regex]::Match($code,'(?s)using var command = new SqlCommand\("""\s*(.*?)\s*""", connection\)')
              if (-not $m.Success) { throw 'Could not extract compatibility SQL' }
              $json=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'fmsc-source/Core/DatabaseCompatibilityRequirements.json') -Raw
              $check=Query $db $m.Groups[1].Value $json
              Write-Host "SCHEMA $schema COMPATIBILITY ERRORS: $($check.Tables[0].Rows[0][0])"
              if ([int]$check.Tables[0].Rows[0][0] -ne 0) { throw "Schema $schema fails the complete structural compatibility contract" }
              if ($check.Tables.Count -gt 1) {
                foreach ($row in $check.Tables[1].Rows) { Write-Host ("  REQUIREMENT: "+$row[0].ToString()) }
                $moduleSource=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'fmsc-source/Services/Communication/CommunicationSchemaContract.cs') -Raw
              $moduleMatch=[regex]::Match($moduleSource,'(?s)await using var structure=new SqlCommand\("""\s*(.*?)\s*""",connection\)')
              if (-not $moduleMatch.Success) { throw 'Cannot locate communication structure SQL' }
              $moduleStruct=Query $db $moduleMatch.Groups[1].Value
              Write-Host "SCHEMA $schema COMM STRUCTURE RESULT: $($moduleStruct.Tables[0].Rows[0][0])"
              $sqlModel=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'fmsc-source/Services/Communication/Schema.sql') -Raw
              $must=@([regex]::Matches($sqlModel,'(?im)^\s*CREATE (PROCEDURE|FUNCTION) comm\.\[?(\w+)\]?') | ForEach-Object { $_.Groups[2].Value } | Sort-Object -Unique)
              $have=Query $db 'SELECT name FROM sys.objects WHERE schema_id=SCHEMA_ID(N''comm'') AND type IN (N''P'',N''FN'',N''IF'',N''TF'');'
              $names=@($have.Tables[0].Rows | ForEach-Object { $_[0].ToString() })
              $missing=@($must | Where-Object { $_ -notin $names })
              Write-Host "SCHEMA $schema COMM MISSING ROUTINES ($($missing.Count)): $($missing -join ',')"
              $parts=[ordered]@{
                module='(SELECT COUNT(*) FROM comm.Module WHERE Version=1)=1'
                claimToken="COL_LENGTH(N'comm.Message',N'ClaimToken')=16"
                simulation="COL_LENGTH(N'comm.Message',N'Simulation')=1"
                providerReference="COL_LENGTH(N'comm.Message',N'ProviderReference')=200"
                consentSource="COL_LENGTH(N'comm.Contact',N'ConsentSource')=400"
                familyFk="EXISTS(SELECT 1 FROM sys.foreign_keys F JOIN sys.foreign_key_columns K ON K.constraint_object_id=F.object_id JOIN sys.columns C ON C.object_id=K.parent_object_id AND C.column_id=K.parent_column_id WHERE F.parent_object_id=OBJECT_ID(N'comm.Contact') AND C.name=N'FamilyId' AND F.delete_referential_action=2 AND F.is_disabled=0 AND F.is_not_trusted=0)"
                contactIdentityIndex="EXISTS(SELECT 1 FROM sys.indexes I JOIN sys.index_columns K ON K.object_id=I.object_id AND K.index_id=I.index_id JOIN sys.columns C ON C.object_id=K.object_id AND C.column_id=K.column_id WHERE I.object_id=OBJECT_ID(N'comm.Contact') AND I.name=N'UX_CommContact_Identity' AND I.is_unique=1 AND C.name=N'OriginalFamilyId' AND K.key_ordinal>0)"
                originalFamilyId="COL_LENGTH(N'comm.Contact',N'OriginalFamilyId')=4"
                revision="COL_LENGTH(N'comm.Contact',N'Revision')=8"
                contentHash="COL_LENGTH(N'comm.Campaign',N'ContentHash')=32"
                pendingReceipt="OBJECT_ID(N'comm.PendingReceipt',N'U') IS NOT NULL"
                enrollmentId="COL_LENGTH(N'comm.Message',N'EnrollmentId')=4"
                ruleBaseline="OBJECT_ID(N'comm.RuleBaseline',N'U') IS NOT NULL"
                dispatchActor="COL_LENGTH(N'comm.Campaign',N'DispatchActor')=4"
                requestHash="COL_LENGTH(N'comm.Campaign',N'RequestHash')=32"
                nextSendUtc="COL_LENGTH(N'comm.Settings',N'NextSendUtc') IS NOT NULL"
                messageIndexes="(SELECT COUNT(*) FROM sys.indexes WHERE object_id=OBJECT_ID(N'comm.Message') AND is_unique=1 AND name IN(N'UX_CommMessage_Recipient',N'UX_CommMessage_Provider'))=2"
                campaignIndex="EXISTS(SELECT 1 FROM sys.indexes WHERE object_id=OBJECT_ID(N'comm.Campaign') AND name=N'UX_CommCampaign_Event' AND is_unique=1)"
                trustedFk="NOT EXISTS(SELECT 1 FROM sys.foreign_keys WHERE schema_id=SCHEMA_ID(N'comm') AND (is_disabled=1 OR is_not_trusted=1))"
                trustedCheck="NOT EXISTS(SELECT 1 FROM sys.check_constraints WHERE schema_id=SCHEMA_ID(N'comm') AND (is_disabled=1 OR is_not_trusted=1))"
              }
              foreach ($item in $parts.GetEnumerator()) {
                $flag=Query $db "SELECT CASE WHEN $($item.Value) THEN 1 ELSE 0 END;"
                if ([int]$flag.Tables[0].Rows[0][0] -ne 1) { Write-Host "SCHEMA $schema COMM FAIL: $($item.Key)" }
              }
            }
            }
          } finally {
            try { [void](Query master "ALTER DATABASE [$db] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; EXEC sys.sp_detach_db @dbname=N'$db';") }
            finally { [System.Data.SqlClient.SqlConnection]::ClearAllPools() }
          }
