name: 99 - One-time Repair Synthetic Schema-7 SQL Fixture

on:
  push:
    branches: ['repair/schema7-disposable-snapshot-20261110']
    paths:
      - '.github/workflows/repair-v7-fixture-once.yml'

permissions:
  contents: write

concurrency:
  group: fmsc-one-time-v7-fixture-repair
  cancel-in-progress: false

jobs:
  repair-verify-commit:
    if: github.repository_id == '1449162585' && github.repository_owner_id == '316891609' && github.ref == 'refs/heads/repair/schema7-disposable-snapshot-20261110'
    runs-on: windows-2022
    timeout-minutes: 80
    env:
      FMSC_DISPOSABLE_INSTALL: approved-synthetic-only
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout owner-approved repair branch with actual Git LFS files
        uses: actions/checkout@v7
        with:
          path: fmsc-sandbox
          lfs: true
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout current public FMSC Source for real migration/installer checks
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/FMSC-Source
          ref: main
          path: fmsc-source
          persist-credentials: false

      - name: Repair only the historical typed GUID in a copy and validate the reattached snapshot
        shell: pwsh
        run: |
          & ./fmsc-sandbox/Tests/RepairHistoricalV7Fixture.ps1 -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox')

      - name: Prove migration and full production SQL contracts on repaired schema 7
        shell: pwsh
        timeout-minutes: 20
        run: |
          & ./fmsc-sandbox/Tests/RunSandboxSqlContract.ps1 -Schema 7 -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-source') -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox')

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Real Windows installer and first-run bootstrap on repaired schema 7
        shell: pwsh
        working-directory: fmsc-source
        timeout-minutes: 45
        run: |
          & ./Tools/RunDisposableWindowsInstall.ps1 -ProjectDirectory . -Level3 -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox') -FixtureSchema 7

      - name: Commit only verified repaired LFS pair and exact manifest on this branch
        shell: pwsh
        working-directory: fmsc-sandbox
        env:
          BRANCH: repair/schema7-disposable-snapshot-20261110
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          git check-attr filter -- Database/v7/FMSC_DB.mdf Database/v7/FMSC_DB_log.ldf
          git add -- Database/v7/FMSC_DB.mdf Database/v7/FMSC_DB_log.ldf Tests/manifest.json
          $changed=@(git diff --cached --name-only)
          if ($changed.Count -ne 3 -or @($changed | Where-Object { $_ -notin @('Database/v7/FMSC_DB.mdf','Database/v7/FMSC_DB_log.ldf','Tests/manifest.json') }).Count -ne 0) {
            throw 'Refusing unexpected or incomplete binary/manifest changes.'
          }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'New Git LFS objects failed fsck.' }
          git commit -m "Repair synthetic schema-7 GUID property with verified SQL native type"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit verified fixture.' }
          git push origin "HEAD:refs/heads/$env:BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to push repaired LFS fixture to the isolated branch.' }
          "Repaired verified synthetic v7 Git LFS files and manifest pushed to branch only." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
