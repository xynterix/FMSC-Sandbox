name: '03 - Private Complete Windows Installer (synthetic v7 included)'

# Execute this from PRIVATE FMSC-Sandbox. Source Workflow 03 itself stays
# DB-free and publicly distributable; only verified synthetic v7 files are private.
on:
  workflow_dispatch:
  # Revalidate the private packager whenever its own workflow changes.
  # No Source push, Source PR, fixture modification or ordinary Sandbox push
  # can publish these private synthetic database files.
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-complete-installer-v7.yml'
      - 'Tests/PackageCompleteInstallerV7.ps1'

permissions:
  contents: read

concurrency:
  group: fmsc-private-ready-installer
  cancel-in-progress: false

jobs:
  resolve-source:
    if: github.ref == 'refs/heads/main' && github.repository_id == '1449162585' && github.repository_owner_id == '316891609'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Pin exact FMSC-Source main commit and verify repository identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          repo="$(curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' 'https://api.github.com/repositories/1412760928')"
          jq -e '.id == 1412760928 and .owner.id == 316891609 and .private == false and .default_branch == "main"' <<<"$repo" >/dev/null
          api="$(jq -r '.url' <<<"$repo")"
          sha="$(curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' "$api/branches/main" | jq -r '.commit.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid Source commit'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Private installer Source revision: $sha" >> "$GITHUB_STEP_SUMMARY"
      # Avoid spending minutes on Windows packaging if Sandbox has no
      # registration credential for a configured Google Desktop client.
      - name: Fail early for missing private Google Desktop registration
        shell: bash
        env:
          REGISTRATION: ${{ secrets.FMSC_GOOGLE_DESKTOP_JSON }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          providers="$(curl -fsSL --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY_OWNER/FMSC-Source/$SOURCE_SHA/CloudBackupProviders.json")"
          google_client="$(jq -r '.GoogleClientId // ""' <<<"$providers")"
          if [[ -n "$google_client" && -z "$REGISTRATION" ]]; then
            echo '::error::FMSC-Sandbox needs its own FMSC_GOOGLE_DESKTOP_JSON Actions secret for the private complete installer.'
            exit 1
          fi

  # Calls the existing public Workflow 03 package builder but runs it in this
  # private Sandbox workflow run. Its output remains database-free.
  package-base:
    needs: resolve-source
    uses: xynterix/FMSC-Source/.github/workflows/fmsc-complete-installer.yml@main
    with:
      source_sha: ${{ needs.resolve-source.outputs.sha }}
    secrets:
      FMSC_GOOGLE_DESKTOP_JSON: ${{ secrets.FMSC_GOOGLE_DESKTOP_JSON }}
    permissions:
      contents: read

  private-v7-package:
    needs: [resolve-source, package-base]
    permissions:
      contents: read
      actions: write
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out private packaging script
        uses: actions/checkout@v7
        with:
          path: sandbox-harness
          persist-credentials: false

      - name: Check out accepted immutable v7 fixture without downloading other LFS files
        uses: actions/checkout@v7
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          repository: ${{ github.repository }}
          ref: 7d225d2b8e38aecd4a1c3cfa7ccfaf56685149b9
          path: frozen-fixtures
          lfs: false
          persist-credentials: false
      - name: Hydrate only the pinned schema-7 MDF/LDF
        shell: pwsh
        env:
          FMSC_FIXTURE_READ_TOKEN: ${{ github.token }}
        run: ./sandbox-harness/Tests/FetchPinnedFixture.ps1 -Schema 7 -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'frozen-fixtures')

      - name: Download Source Workflow 03 installer from this private run
        uses: actions/download-artifact@v7
        with:
          name: FMSC_SMS-Complete-Windows-x64-Add-Database-Files
          path: ${{ runner.temp }}/fmsc-private-complete-installer

      - name: Refuse a stale Source main SHA
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = Invoke-RestMethod -Uri 'https://api.github.com/repositories/1412760928'
          $api = $repo.url
          if ($repo.id -ne 1412760928 -or $repo.owner.id -ne 316891609 -or $repo.private) {
              throw 'Source repository identity unexpectedly changed.'
          }
          $current = (Invoke-RestMethod -Uri "$api/branches/main").commit.sha
          if ($current -cne $env:SOURCE_SHA) {
              throw 'Source/main moved during private packaging; rerun for the current revision.'
          }

      - name: Validate and include only frozen synthetic v7 MDF/LDF copies
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          & ./sandbox-harness/Tests/PackageCompleteInstallerV7.ps1 `
            -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'fmsc-private-complete-installer') `
            -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'frozen-fixtures') `
            -SourceSha $env:SOURCE_SHA

      - name: Upload complete private fresh-install bundle with synthetic v7
        uses: actions/upload-artifact@v7
        with:
          name: FMSC_SMS-Complete-Windows-x64-Synthetic-v7-Included
          path: ${{ runner.temp }}/fmsc-private-complete-installer/
          compression-level: 6
          if-no-files-found: error
          retention-days: 7

      # Only after the final private package was uploaded successfully.
      # Never delete a failed or unpublished package needed for recovery.
      - name: Delete redundant base artifact after successful private packaging
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            if (context.repo.repo !== 'FMSC-Sandbox' ||
                context.payload.repository?.owner?.id !== 316891609 ||
                context.payload.repository?.id !== 1449162585) {
              throw new Error('Refusing artifact deletion outside the private Sandbox repository.');
            }
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId, per_page: 100
            });
            const finalName = 'FMSC_SMS-Complete-Windows-x64-Synthetic-v7-Included';
            const baseName = 'FMSC_SMS-Complete-Windows-x64-Add-Database-Files';
            const finished = artifacts.find(a => a.name === finalName && !a.expired && a.size_in_bytes > 0);
            if (!finished) {
              throw new Error('Verified private output artifact is missing: preserving intermediate artifact.');
            }
            const intermediate = artifacts.find(a => a.name === baseName && !a.expired);
            if (!intermediate) {
              core.info('No redundant intermediate artifact remains.');
            } else {
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: intermediate.id });
                core.info('Removed redundant base installer artifact after successful private upload.');
              } catch (error) {
                core.warning('Intermediate cleanup failed; the verified private package remains intact: ' + error.message);
              }
            }
