name: 00 - Private MDF-LDF Release Acceptance

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact current FMSC-Source/main commit SHA'
        required: true
        type: string
  # Changes to this trusted workflow re-test the current public Source/main.
  # Only exact Source/main can be tested or granted release attestation.
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-release-acceptance.yml'
      # The trusted fixture validators are part of the acceptance gate;
      # changes to them must execute the full exact-Source-SHA acceptance.
      - 'Tests/RunSandboxSqlContract.ps1'
      - 'Tests/FetchPinnedFixture.ps1'

permissions:
  contents: read

concurrency:
  group: fmsc-private-sql-acceptance
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && github.repository_id == '1449162585' && github.repository_owner_id == '316891609'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      target_schema: ${{ steps.source.outputs.target_schema }}
      source_repo: ${{ steps.source.outputs.source_repo }}
    steps:
      - id: source
        name: Resolve exact public Source commit with workflow authentication
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="$(curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GITHUB_TOKEN" \
            'https://api.github.com/user/316891609')"
          login="$(jq -r 'select(.id == 316891609 and .type == "User") | .login' <<<"$owner")"
          [[ "$login" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]] || exit 1
          source_repo="$login/FMSC-Source"
          source="$(curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$source_repo")"
          jq -e --arg repo "$source_repo" '
            .id == 1412760928 and .owner.id == 316891609 and
            .full_name == $repo and .name == "FMSC-Source" and .private == false
          ' <<<"$source" >/dev/null || exit 1
          main_sha="$(curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$source_repo/branches/main" | jq -r '.commit.sha')"
          if [[ "$EVENT_NAME" == "push" ]]; then
            sha="$main_sha"
          else
            sha="$INPUT_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid exact Source SHA'; exit 1; }
          if [[ "$sha" != "$main_sha" ]]; then
            echo 'Refusing anything other than exact current Source/main SHA for private fixture execution.'
            exit 1
          fi
          # Resolve the only authoritative schema from core.ps1 in the
          # exact pinned public Source SHA, never an operator input.
          raw="https://raw.githubusercontent.com/$source_repo/$sha"
          target="$(curl -fsSL --retry 3 "$raw/Installer/core.ps1" |
            grep -E '^\$DatabaseVersion[[:space:]]*=' | grep -Eo '[0-9]+' | head -1)"
          [[ "$target" =~ ^[1-9][0-9]*$ ]] &&
            (( target >= 7 && target <= 9999 )) || {
              echo 'Refusing invalid or inconsistent Source migration target.'; exit 1;
            }
          echo "target_schema=$target" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source_repo=$source_repo" >> "$GITHUB_OUTPUT"
          echo "Testing Source SHA: $sha" >> "$GITHUB_STEP_SUMMARY"

  sql-contract:
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        schema: [7]
    steps:
      - name: Checkout private test harness without LFS hydration
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout exact immutable fixture commit without LFS downloads
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: 7d225d2b8e38aecd4a1c3cfa7ccfaf56685149b9
          path: fmsc-sandbox
          lfs: false
          persist-credentials: false
      - name: Hydrate only pinned schema-7 SQL files
        shell: pwsh
        env:
          FMSC_FIXTURE_READ_TOKEN: ${{ github.token }}
        run: ./Tests/FetchPinnedFixture.ps1 -Schema 7 -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox')
      - name: Checkout exact public Source SHA
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: fmsc-source
          persist-credentials: false
      - name: Validate immutable MDF-LDF copies and complete production SQL contracts
        shell: pwsh
        run: |
          ./Tests/RunSandboxSqlContract.ps1 -Schema ${{ matrix.schema }} `
            -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-source') `
            -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox')

  real-installer:
    # The v7 schema job installs into its own disposable Windows runner and
    # revalidates the immutable fixture. It does not consume sql-contract output.
    # Run alongside SQL contracts; publication still requires ALL checks in attest.
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        schema: [7]
    env:
      FMSC_DISPOSABLE_INSTALL: approved-synthetic-only
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      FMSC_TESTED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
    steps:
      - name: Checkout exact public Source SHA
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve.outputs.source_repo }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Checkout frozen private fixtures without LFS downloads
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: 7d225d2b8e38aecd4a1c3cfa7ccfaf56685149b9
          path: fmsc-sandbox
          lfs: false
          persist-credentials: false
      - name: Checkout trusted Sandbox hydration helper
        uses: actions/checkout@v7
        with:
          path: sandbox-harness
          persist-credentials: false
      - name: Hydrate only pinned schema-7 SQL files
        shell: pwsh
        env:
          FMSC_FIXTURE_READ_TOKEN: ${{ github.token }}
        run: ./sandbox-harness/Tests/FetchPinnedFixture.ps1 -Schema 7 -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox')
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Real Windows installer against isolated historical/current database copy
        shell: pwsh
        timeout-minutes: 45
        run: |
          ./Tools/RunDisposableWindowsInstall.ps1 -ProjectDirectory . -Level3 `
            -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox') `
            -FixtureSchema ${{ matrix.schema }}
      - name: Restore pinned SQLPackage tooling for independent billing and recovery regressions
        shell: pwsh
        run: dotnet tool restore --tool-manifest Tests/LifecycleSqlChecks/.config/dotnet-tools.json
      - name: SQL billing and update-recovery regressions
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./Tools/TestAutomaticBilling.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Billing regression failed.' }
          ./Tools/TestUpdateRecoverySql.ps1
          if ($LASTEXITCODE -ne 0) { throw 'SQL recovery regression failed.' }
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fmsc-private-acceptance-${{ github.run_id }}-attempt${{ github.run_attempt }}-v${{ matrix.schema }}
          path: |
            ${{ runner.temp }}/fmsc-install-evidence/report.json
            ${{ runner.temp }}/fmsc-install-evidence/summary.md
          if-no-files-found: warn
          retention-days: 7

  # Legacy schema-3 chaos coverage remains in separate manual migration-chaos workflow.

  # No Source checkout or arbitrary Source scripts in this token-bearing job.
  # Status can be issued only for the exact current Source/main commit.
  attest:
    needs: [resolve, sql-contract, real-installer]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.repository_id == '1449162585' && github.repository_owner_id == '316891609' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha || inputs.source_sha }}
      TARGET_SCHEMA: ${{ needs.resolve.outputs.target_schema }}
      RESOLVE_RESULT: ${{ needs.resolve.result }}
      SQL_RESULT: ${{ needs.sql-contract.result }}
      INSTALL_RESULT: ${{ needs.real-installer.result }}
      ATTEST_TOKEN: ${{ secrets.FMSC_SOURCE_ATTEST_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SOURCE_REPO: ${{ needs.resolve.outputs.source_repo }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Attest only exact current Source main SHA, fail closed
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY_ID" == '1449162585' && "$GITHUB_REPOSITORY_OWNER_ID" == '316891609' ]] || exit 1
          owner="$(curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GITHUB_TOKEN" 'https://api.github.com/user/316891609')"
          login="$(jq -r 'select(.id == 316891609 and .type == "User") | .login' <<<"$owner")"
          [[ "$login" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]] || exit 1
          # Resolve failures have no outputs; the dispatch input remains usable
          # only after independent immutable owner/repository and HEAD checks.
          [[ -z "$SOURCE_REPO" || "$SOURCE_REPO" == "$login/FMSC-Source" ]] || exit 1
          SOURCE_REPO="$login/FMSC-Source"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Missing or invalid exact Source SHA; no attestation granted.'; exit 1; }
          api="https://api.github.com/repos/$SOURCE_REPO"
          source="$(curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GITHUB_TOKEN" "$api")"
          jq -e --arg repo "$SOURCE_REPO" '.id == 1412760928 and .owner.id == 316891609 and .full_name == $repo' <<<"$source" >/dev/null || exit 1
          main="$(curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GITHUB_TOKEN" "$api/branches/main" | jq -r '.commit.sha')"
          if [[ "$SOURCE_SHA" != "$main" ]]; then
            echo 'Acceptance INVALIDATED: Source/main changed during testing; no attestation granted.'
            exit 1
          fi
          [[ -n "$ATTEST_TOKEN" ]] || { echo 'FMSC_SOURCE_ATTEST_TOKEN not configured; approval withheld.'; exit 1; }
          state='failure'
          description="MDF/LDF acceptance FAILED (resolve=$RESOLVE_RESULT)"
          # A failed source resolver still emits a trusted failure status for
          # this exact dispatch SHA, allowing Workflow 04 to fail promptly.
          # Never approve when the resolver or any required job was skipped.
          if [[ "$RESOLVE_RESULT" == 'success' &&
                "$TARGET_SCHEMA" =~ ^[1-9][0-9]*$ &&
                "$SQL_RESULT" == 'success' && "$INSTALL_RESULT" == 'success' ]]; then
            state='success'
            description="MDF/LDF v7 -> v$TARGET_SCHEMA SQL+installer+recovery PASS (fixture 7d225d2b)"
          fi
          payload="$(jq -n --arg state "$state" --arg context 'fmsc/sandbox-mdf-ldf/v2' \
            --arg description "$description" --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error --retry 3 -X POST \
            -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $ATTEST_TOKEN" \
            --data "$payload" "$api/statuses/$SOURCE_SHA" > /dev/null
          echo "Private acceptance status: $state for $SOURCE_SHA"
          [[ "$state" == 'success' ]] || exit 1
