name: Temporary synthetic schema-3 repair (isolated)
on:
  push:
    branches: [maintenance/repair-v3-synthetic-fixture]
    paths:
      - 'Tests/RepairHistoricalV3Fixture.ps1'
      - '.github/workflows/temporary-repair-v3.yml'
permissions:
  contents: write
concurrency:
  group: fmsc-sandbox-v3-one-time-repair
  cancel-in-progress: false
jobs:
  repair-and-verify:
    if: >-
      github.ref == 'refs/heads/maintenance/repair-v3-synthetic-fixture' &&
      github.repository_id == '1449162585' &&
      github.repository_owner_id == '316891609'
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      FMSC_DISPOSABLE_INSTALL: approved-synthetic-only
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout isolated Sandbox branch without stored credentials
        uses: actions/checkout@v7
        with:
          path: fmsc-sandbox
          lfs: true
          persist-credentials: false
      - name: Checkout public Source/main without stored credentials
        uses: actions/checkout@v7
        with:
          repository: xynterix/FMSC-Source
          ref: main
          path: fmsc-source
          persist-credentials: false
      - name: Guard repository identity and Source main revision
        shell: pwsh
        run: |
          $owner=Invoke-RestMethod 'https://api.github.com/user/316891609'
          $source=Invoke-RestMethod "https://api.github.com/repos/$($owner.login)/FMSC-Source"
          if ($source.id -ne 1412760928 -or $source.owner.id -ne 316891609 -or $source.private) {
            throw 'Unexpected Source repository.'
          }
          $sourceHead=(git -C fmsc-source rev-parse HEAD).Trim()
          $branchHead=(git -C fmsc-sandbox rev-parse HEAD).Trim()
          if ($branchHead -cne '${{ github.sha }}') { throw 'Sandbox branch changed during checkout.' }
          $actualSource=(Invoke-RestMethod "https://api.github.com/repos/$($owner.login)/FMSC-Source/branches/main").commit.sha
          if ($actualSource -cne $sourceHead) { throw 'Source main moved during checkout.' }
          $sourceHead | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'fmsc-v3-verified-source.txt')
      - name: Repair only checksum-verified synthetic v3 SQL copies
        shell: pwsh
        run: |
          ./fmsc-sandbox/Tests/RepairHistoricalV3Fixture.ps1 -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox')
      - name: Verify migration SQL and production compatibility from v3
        shell: pwsh
        timeout-minutes: 22
        run: |
          ./fmsc-sandbox/Tests/RunSandboxSqlContract.ps1 -Schema 3 -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-source') -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox')
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify real Windows installer updater and recovery with repaired v3 copy
        working-directory: fmsc-source
        shell: pwsh
        timeout-minutes: 55
        run: |
          ./Tools/RunDisposableWindowsInstall.ps1 -ProjectDirectory . -Level3 -FixtureRoot (Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox') -FixtureSchema 3
      - name: Refuse obsolete result if Source main moved
        shell: pwsh
        run: |
          $owner=Invoke-RestMethod 'https://api.github.com/user/316891609'
          $head=(Invoke-RestMethod "https://api.github.com/repos/$($owner.login)/FMSC-Source/branches/main").commit.sha
          $expected=(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'fmsc-v3-verified-source.txt') -Raw).Trim()
          if ($head -cne $expected) { throw 'Source main moved during v3 acceptance.' }
      - name: Commit only verified v3 LFS files on isolated feature branch
        shell: pwsh
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'fmsc-sandbox'
          if ((git -C $root rev-parse HEAD).Trim() -cne '${{ github.sha }}' -or
              (git -C $root branch --show-current).Trim() -cne 'maintenance/repair-v3-synthetic-fixture') {
            throw 'Unexpected branch or changed head.'
          }
          git -C $root lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS setup failed.' }
          git -C $root add -- 'Database/v3/FMSC_DB.mdf' 'Database/v3/FMSC_DB_log.ldf' 'Database/v3/README.md' 'Tests/manifest.json'
          if ($LASTEXITCODE -ne 0) { throw 'Staging repair failed.' }
          $staged=@(git -C $root diff --cached --name-only)
          $allowed=@('Database/v3/FMSC_DB.mdf','Database/v3/FMSC_DB_log.ldf','Database/v3/README.md','Tests/manifest.json')
          if (@($staged | Where-Object { $_ -cnotin $allowed }).Count -gt 0 -or $staged.Count -eq 0) {
            throw 'Unexpected staged content or repair made no change.'
          }
          $lfs=@(git -C $root lfs ls-files)
          if (@($lfs | Where-Object { $_ -match 'Database/v3/FMSC_DB(_log)?\.(mdf|ldf)' }).Count -ne 2) {
            throw 'Both fixture binaries must remain LFS-managed.'
          }
          git -C $root -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(sandbox): validate and normalize synthetic v3 MDF/LDF GUID'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit verified fixture.' }
          $basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:PUSH_TOKEN"))
          try {
            git -C $root config --local 'http.https://github.com/.extraheader' "AUTHORIZATION: basic $basic"
            git -C $root push origin HEAD:refs/heads/maintenance/repair-v3-synthetic-fixture
            if ($LASTEXITCODE -ne 0) { throw 'Could not push verified v3 Git LFS fixture.' }
          } finally {
            git -C $root config --local --unset-all 'http.https://github.com/.extraheader' 2>$null
            $basic=$null
          }
          "Schema-3 MDF/LDF validated and updated only on feature branch. V7 and release gate unchanged." >> $env:GITHUB_STEP_SUMMARY
