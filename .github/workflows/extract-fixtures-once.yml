name: 00 - Extract permanent SQL fixtures once

on:
  push:
    paths:
      - .github/workflows/extract-fixtures-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Verify ZIPs and persist MDF/LDF as Git LFS objects
    if: github.repository == 'farhan2166-creator/FMSC-Sandbox' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private sandbox
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Inspect and extract exactly four clean source files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import stat
          import zipfile

          root = pathlib.Path.cwd()
          specs = {
              3: {"FMSC_DB.mdf": 8388608, "FMSC_DB_log.ldf": 75497472},
              7: {"FMSC_DB.mdf": 8388608, "FMSC_DB_log.ldf": 75497472},
          }

          def digest(path):
              h = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          manifest_path = root / "Tests" / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          for version, expected in specs.items():
              archive = root / f"FMSC-schema-v{version}.zip"
              if not archive.is_file() or archive.stat().st_size > 25 * 1024 * 1024:
                  raise RuntimeError(f"Missing or oversized approved archive for schema {version}")
              target_dir = root / "Database" / f"v{version}"
              with zipfile.ZipFile(archive) as z:
                  entries = z.infolist()
                  if len(entries) != 2 or sorted(x.filename for x in entries) != sorted(expected):
                      raise RuntimeError(f"Unexpected ZIP members for schema {version}: {[x.filename for x in entries]}")
                  for item in entries:
                      if item.file_size != expected[item.filename] or (item.flag_bits & 1):
                          raise RuntimeError(f"Invalid size or encrypted entry for {item.filename}")
                      if stat.S_ISLNK(item.external_attr >> 16):
                          raise RuntimeError("Symlinks are forbidden in fixture ZIPs")
                      destination = target_dir / item.filename
                      if destination.exists():
                          raise RuntimeError(f"Refusing to overwrite existing fixture: {destination}")
                      with z.open(item, "r") as source, open(destination, "xb") as target:
                          shutil.copyfileobj(source, target, length=1024 * 1024)
                      if destination.stat().st_size != expected[item.filename]:
                          raise RuntimeError(f"Output length mismatch for {destination}")
                  print(f"Verified and extracted schema-{version} files from {archive.name}")

              fixture = next((f for f in manifest["fixtures"] if f["schema"] == version), None)
              if not fixture:
                  raise RuntimeError(f"No manifest record for schema {version}")
              fixture["status"] = "extracted-schema-only-pending-sql-validation"
              fixture["mdfSha256"] = digest(target_dir / "FMSC_DB.mdf")
              fixture["ldfSha256"] = digest(target_dir / "FMSC_DB_log.ldf")
              fixture["sourceZip"] = archive.name
              fixture["sourceZipSha256"] = digest(archive)

          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit exactly the extracted pairs using Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for version in 3 7; do
            for filename in FMSC_DB.mdf FMSC_DB_log.ldf; do
              path="Database/v${version}/${filename}"
              if [[ "$(git check-attr filter -- "$path")" != "$path: filter: lfs" ]]; then
                echo "::error::Not configured for Git LFS: $path"
                exit 1
              fi
              git add -- "$path"
              if ! git show ":$path" | grep -q '^version https://git-lfs.github.com/spec/v1'; then
                echo "::error::Staged file is not a Git LFS pointer: $path"
                exit 1
              fi
            done
          done

          git add -- Tests/manifest.json
          git lfs ls-files
          git diff --cached --stat
          git commit -m 'Persist clean schema-3 and schema-7 MDF/LDF fixtures via Git LFS'
          git push origin HEAD:main
